[package]
name = "rin-glow"
description = "Rin Glow: an EffectCraft effect plug-in (WebAssembly, plug-in API v1) that makes bright areas glow"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: build with `cargo build --release --target wasm32-unknown-unknown` in this folder.
[workspace]

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
